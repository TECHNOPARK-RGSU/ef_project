services:
  backend:
    build:
      context: ./backend
    ports:
      - "26111:8000"
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-projectaris.jkproduction.pro,www.projectaris.jkproduction.pro,localhost,127.0.0.1}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-dev-unsafe-change-me}"
      DJANGO_CORS_ALLOWED_ORIGINS: "${DJANGO_CORS_ALLOWED_ORIGINS:-https://projectaris.jkproduction.pro,http://localhost:26110}"
      DJANGO_CORS_ALLOW_ALL: "${DJANGO_CORS_ALLOW_ALL:-0}"
      USE_POSTGRES: "${USE_POSTGRES:-1}"
      DB_HOST: "${DB_HOST:-host.docker.internal}"
      DB_PORT: "${DB_PORT:-26113}"
      DB_NAME: "${DB_NAME:-ef_project}"
      DB_USER: "${DB_USER:-ef_project}"
      DB_PASSWORD: "${DB_PASSWORD:-change-me}"
      MINIO_ENABLED: "${MINIO_ENABLED:-1}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-https://s3.example.com}"
      MINIO_PUBLIC_URL: "${MINIO_PUBLIC_URL:-https://s3.example.com}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-change-me}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-change-me}"
      MINIO_BUCKET: "${MINIO_BUCKET:-change-me}"
      MINIO_REGION: "${MINIO_REGION:-us-east-1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    ports:
      - "26110:80"
