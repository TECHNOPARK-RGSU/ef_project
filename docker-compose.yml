services:
  backend:
    build:
      context: ./backend
    ports:
      - "26111:8000"
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-1}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-projectaris.jkproduction.pro,www.projectaris.jkproduction.pro,localhost,127.0.0.1}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-dev-unsafe-change-me}"
      DJANGO_CORS_ALLOWED_ORIGINS: "${DJANGO_CORS_ALLOWED_ORIGINS:-https://projectaris.jkproduction.pro,http://localhost:26110}"
      DJANGO_CORS_ALLOW_ALL: "${DJANGO_CORS_ALLOW_ALL:-0}"
      USE_POSTGRES: "${USE_POSTGRES:-1}"
      DB_HOST: "${DB_HOST:-host.docker.internal}"
      DB_PORT: "${DB_PORT:-26113}"
      DB_NAME: "${DB_NAME:-ef_project}"
      DB_USER: "${DB_USER:-ef_project}"
      DB_PASSWORD: "${DB_PASSWORD:-change-me}"
      MINIO_ENABLED: "${MINIO_ENABLED:-1}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://minio:9000}"
      MINIO_PUBLIC_URL: "${MINIO_PUBLIC_URL:-https://projectaris.jkproduction.pro:26112}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-change-me}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      MINIO_BUCKET: "${MINIO_BUCKET:-ef-project}"
      MINIO_REGION: "${MINIO_REGION:-ru-central}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - minio

  frontend:
    build:
      context: ./frontend
    ports:
      - "26110:80"

  minio:
    image: minio/minio:latest
    command: server --console-address ":9001" /data
    ports:
      - "26112:9000"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$MINIO_BUCKET || true &&
      mc anonymous set download local/$$MINIO_BUCKET || true
      "
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
      MINIO_BUCKET: "ef-project"

volumes:
  minio_data:
